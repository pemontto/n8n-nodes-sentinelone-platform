"""
Mutation root
"""
type Mutation {
	"""
	Creates a new alert note
	"""
	addAlertNote(
		"""
		ID of the alert the note should belong to.
		"""
		alertId: ID!

		"""
		Plain text version of the text field.
		"""
		plainText: String

		"""
		Note formatted text.
		"""
		text: String!

		"""
		Note type.
		"""
		type: ContentType
	): AlertNotesListResponse!

	"""
	Triggers specified actions.
	"""
	alertTriggerActions(
		"""
		The list of actions to trigger on filtered / all alerts.
		"""
		actions: [TriggerActionInput!] = []

		"""
		Filter to apply. If `null` triggers actions on all alerts.
		"""
		filter: OrFilterSelectionInput

		"""
		Scope selection.
		"""
		scope: ScopeSelectorInput

		"""
		Selected predefined view.
		"""
		viewType: ViewType = ALL
	): TriggerActionsResult

	"""
	Deletes an existing alert note
	"""
	deleteAlertNote(
		"""
		ID of the alert note to delete.
		"""
		alertNoteId: ID!
	): AlertNotesListResponse!

	"""
	Updates an existing alert note
	"""
	updateAlertNote(
		"""
		ID of the alert note to update.
		"""
		alertNoteId: ID!

		"""
		Plain text version of the text field.
		"""
		plainText: String

		"""
		New formatted text of the alert note.
		"""
		text: String!

		"""
		Note type.
		"""
		type: ContentType
	): AlertNotesListResponse!
}

