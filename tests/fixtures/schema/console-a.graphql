	"""
	The Advisory link from the source vendor.
	"""
	srcUrl: String

	"""
	A title or a brief phrase summarizing the Advisory.
	"""
	title: String

	"""
	The unique identifier assigned to the advisory or disclosed vulnerability, e.g, <code>GHSA-5mrr-rgp6-x4gr</code>.
	"""
